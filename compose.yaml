services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: camnova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-camnova_local_only}
      POSTGRES_DB: camnova
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["camnova_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camnova -d camnova"]
      interval: 3s
      retries: 20
volumes:
  camnova_pgdata:
    external: true
    name: camnova_pgdata
